# Weekly: is the LinkedIn token about to expire, and do the Bluesky and Mastodon credentials still work?
# LinkedIn gives self-serve apps a 60-day token and no refresh token, so a human has to
# re-run .github/syndicate/linkedin_auth.py. This opens an issue before it lapses.
# Nothing is checked until the secrets exist, and X is never called (it bills per request).
name: Syndication token check

on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    if: github.repository == 'dlockamy/dlockamy.github.io'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/syndicate/requirements.txt
      - run: pip install -r .github/syndicate/requirements.txt
      - name: Check credentials
        id: chk
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: |
          set +e
          python .github/syndicate/syndicate.py check-tokens --report problems.md
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" = "0" ] || [ "$rc" = "2" ]
      - name: Open (or update) an issue when something needs attention
        if: steps.chk.outputs.rc == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create syndication-token --color D93F0B --description "A cross-posting credential needs attention" 2>/dev/null || true
          existing=$(gh issue list --label syndication-token --state open --json number --jq '.[0].number')
          body=$(printf 'The weekly syndication check found:\n\n%s\n\nFix: run `python3 .github/syndicate/linkedin_auth.py --client-id <id>` (LinkedIn), or create a new Bluesky app password and update the BLUESKY_APP_PASSWORD secret. Details: .github/SYNDICATION.md\n\nRun: %s/%s/actions/runs/%s\n' "$(cat problems.md)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          if [ -z "$existing" ]; then
            gh issue create --title "Cross-posting: a credential needs attention" --label syndication-token --body "$body"
          else
            echo "Issue #$existing is already open; not adding a comment every week."
          fi
