name: Syndication tests

on:
  pull_request:
    paths: [".github/syndicate/**", ".github/workflows/syndicate*.yml"]
  push:
    branches: [master]
    paths: [".github/syndicate/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/syndicate/requirements.txt
      - run: pip install -r .github/syndicate/requirements.txt
      - run: python -m unittest discover -s .github/syndicate -p "test_*.py" -v
