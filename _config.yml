title: "dlockamy.com | My God, It's Full of Bits....."
tagline: "My God, It's Full of Bits....."
description: "Senior DevOps Engineer. Builder of pipelines, infrastructure, and things that ship reliably."
author:
  name: Douglas Lockamy
  location: Cary, NC
  github: dlockamy
  email: dlockamy@gmail.com

url: "https://dlockamy.com"
baseurl: ""

github_username: dlockamy

permalink: /posts/:year/:month/:day/:title/

theme: null
plugins:
  - jekyll-feed

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - README.md
  - .git
  - dlockamy-jekyll/
