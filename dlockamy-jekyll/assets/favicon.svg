<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Phosphor teal glow on text -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur1"/>
      <feGaussianBlur stdDeviation="1" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle outer glow for the border -->
    <filter id="borderglow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Dark background matching --black -->
  <rect width="100" height="100" fill="#050a0e"/>

  <!-- Teal corner brackets (callback to the site UI) -->
  <!-- Top-left -->
  <path d="M8,8 L8,22 M8,8 L22,8" stroke="#00e5cc" stroke-width="2.5" stroke-opacity="0.6" fill="none" filter="url(#borderglow)"/>
  <!-- Top-right -->
  <path d="M92,8 L92,22 M92,8 L78,8" stroke="#00e5cc" stroke-width="2.5" stroke-opacity="0.6" fill="none" filter="url(#borderglow)"/>
  <!-- Bottom-left -->
  <path d="M8,92 L8,78 M8,92 L22,92" stroke="#00e5cc" stroke-width="2.5" stroke-opacity="0.6" fill="none" filter="url(#borderglow)"/>
  <!-- Bottom-right -->
  <path d="M92,92 L92,78 M92,92 L78,92" stroke="#00e5cc" stroke-width="2.5" stroke-opacity="0.6" fill="none" filter="url(#borderglow)"/>

  <!-- DJL — Orbitron-style geometric letterforms, hand-drawn for pixel accuracy -->
  <!-- D -->
  <path d="M14,32 L14,68 L22,68 Q36,68 36,50 Q36,32 22,32 Z
           M20,38 L22,38 Q29,38 29,50 Q29,62 22,62 L20,62 Z"
        fill="#00e5cc" filter="url(#glow)"/>

  <!-- J -->
  <path d="M44,32 L60,32 L60,38 L55,38 L55,60 Q55,68 47,68 Q40,68 40,61 L40,57 L46,57 L46,61 Q46,62 47,62 Q49,62 49,60 L49,38 L44,38 Z"
        fill="#00e5cc" filter="url(#glow)"/>

  <!-- L -->
  <path d="M66,32 L72,32 L72,62 L86,62 L86,68 L66,68 Z"
        fill="#00e5cc" filter="url(#glow)"/>

  <!-- Subtle scanline across center -->
  <line x1="0" y1="50" x2="100" y2="50"
        stroke="#00e5cc" stroke-opacity="0.04" stroke-width="1"/>
</svg>
