  domain: —
  status: active
  description: "Sol's sibling network — the shared, customer-facing PROD platform on AWS ECS behind Quickring's hub, Spec-Up's API, and the studio's Keycloak identity backend. A different star for a genuinely different network: Sol stays home/internal-only; Sirius is the surface real users (and real logins) hit."

